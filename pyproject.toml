[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-assistant"
version = "0.1.0"
description = "Self-hosted AI voice assistant: WebSocket audio, STT, VAD, streaming TTS, voice cloning, and pluggable conversational backends."
requires-python = ">=3.11"
# Floors only; no lockfile yet (see README "Limitations"). Install on the
# deployment host and pin the resulting image/digest for reproducible releases.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "faster-whisper>=1.0",
    "pocket-tts>=0.2",
    # NOTE: install torch from the CPU index on Linux to avoid multi-GB
    # CUDA wheels: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.5",
    # NOTE: Silero VAD has no PyPI distribution used here — it loads via
    # torch.hub (pinned by VOICE_VAD_SOURCE, vendorable with local:).
    # Do not `pip install silero-vad`; it is not this dependency.
    "numpy>=1.26",
    "scipy>=1.14",
    "httpx>=0.28",
]

[tool.setuptools]
# Explicitly list the runtime package. Without this, setuptools' flat-layout
# discovery mistakes infra/ and deploy/ for Python packages on a clean checkout.
packages = ["app"]

# Tests are stdlib unittest so they run without ANY third-party package:
#   python3 -m unittest discover -s tests -v
# (pytest is intentionally not a dependency.)

[tool.ruff]
line-length = 100
target-version = "py311"
